name: CodeCraft verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "{{JAVA_VERSION}}"
          cache: maven
      - name: Verify
        run: >-
          {{VERIFY_COMMAND_SHELL}}
